[project]
name = "modgudr-workspace"
version = "0.0.0"
description = "Virtual workspace root of modgudr (never built)."
requires-python = ">=3.12"

[tool.uv]
package = false
# M12 pins sqlglot at exactly 30.24.0 (>= 30.23 for Oracle q'...' literals). fakesnow 0.11.22, the
# newest, declares sqlglot ~= 30.22.0; the override makes the whole workspace, fakesnow included,
# resolve to the classifier's version (see docs/mvp-run-report.md, Deviations).
override-dependencies = ["sqlglot==30.24.0"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
modgudr-client = { workspace = true }
modgudr-broker = { workspace = true }
modgudr-sql = { workspace = true }
modgudr-kubectl = { workspace = true }
modgudr-store-file = { workspace = true }
modgudr-store-bws = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
    "types-PyYAML",
    "fakesnow",
    "modgudr-client",
    "modgudr-broker",
    "modgudr-sql[snowflake,oracle]",
    "modgudr-kubectl",
    "modgudr-store-file",
    "modgudr-store-bws",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tmp", "pyright-view"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "PTH", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["modgudr"]

[tool.ruff.lint.per-file-ignores]
# Pyright resolves an absolute `modgudr.<x>` import to the client's regular package
# (`modgudr/__init__.py` with extend_path) even when `<x>` lives in another member, so inside the
# broker distribution `modgudr.spi` and `modgudr.broker.*` are imported relatively. The other
# members import them absolutely through `pyright-view` (see [tool.pyright]).
"packages/broker/src/**" = ["TID252"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = [
    "packages/client/src",
    "packages/broker/src",
    "packages/sql/src",
    "packages/kubectl/src",
    "packages/store-file/src",
    "packages/store-bws/src",
]
# `pyright-view/modgudr` is the merged `modgudr` package as Python sees it at run time: the client's
# `__init__.py` (extend_path) with every member's subpackage symlinked beside it. Pyright does not
# follow extend_path, so without the view `modgudr.spi` is unresolvable outside the broker.
extraPaths = [
    "pyright-view",
    "packages/client/src",
    "packages/broker/src",
    "packages/sql/src",
    "packages/kubectl/src",
    "packages/store-file/src",
    "packages/store-bws/src",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "oracle: needs Docker and the Oracle Free image; fails when Docker is missing, never skips",
    "kind: needs a kind cluster; opt in with MODGUDR_TEST_KIND=1",
    "snowflake_live: needs a live Snowflake account; opt in with MODGUDR_SF_LIVE=1",
]

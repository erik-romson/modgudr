[project]
name = "modgudr-client"
version = "0.1.0"
description = "modgudr: modgudr-client"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
modgudr = "modgudr.client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modgudr"]

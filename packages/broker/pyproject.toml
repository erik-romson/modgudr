[project]
name = "modgudr-broker"
version = "0.1.0"
description = "modgudr: modgudr-broker"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["modgudr-client", "pydantic>=2.14,<3", "PyYAML>=6.0.3"]

[project.scripts]
modgudr-broker = "modgudr.broker.daemon:entry"

[tool.uv.sources]
modgudr-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modgudr"]

[project]
name = "modgudr-broker"
version = "0.1.0"
description = "modgudr: modgudr-broker"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["modgudr-client"]

[tool.uv.sources]
modgudr-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modgudr"]

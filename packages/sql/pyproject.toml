[project]
name = "modgudr-sql"
version = "0.1.0"
description = "modgudr: modgudr-sql"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["modgudr-broker"]

[tool.uv.sources]
modgudr-broker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modgudr"]

[project]
name = "modgudr-sql"
version = "0.1.0"
description = "modgudr: modgudr-sql"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["modgudr-broker", "sqlglot==30.24.0"]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=4.8,<5", "cryptography"]

[project.entry-points."modgudr.connectors"]
sql = "modgudr.sql.connector:SqlConnector"

[project.entry-points."modgudr.sql_dialects"]
snowflake = "modgudr.sql.dialects.snowflake:SnowflakeDialect"
oracle = "modgudr.sql.dialects.oracle:OracleDialect"

[tool.uv.sources]
modgudr-broker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modgudr"]

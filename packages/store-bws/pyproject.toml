[project]
name = "modgudr-store-bws"
version = "0.1.0"
description = "modgudr: modgudr-store-bws"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["modgudr-broker"]

[project.entry-points."modgudr.secret_stores"]
bws = "modgudr.store_bws:BwsStore"

[tool.uv.sources]
modgudr-broker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modgudr"]
